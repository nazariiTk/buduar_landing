<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Будуар Трускавець</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;500;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0a0d;
      --surface: #1a1218;
      --rose: #c9748a;
      --rose-light: #e8a0b4;
      --gold: #c9a96e;
      --text: #f0e8ec;
      --muted: #8a7a82;
      --border: rgba(201, 116, 138, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 48px;
      overflow-x: hidden;
    }

    /* ── BANNER ──────────────────────────────────── */
    #inapp-banner {
      display: none;
      width: 100%;
      background: #111;
      border-bottom: 2px solid var(--rose);
      padding: 14px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 999;
      animation: slideDown .4s ease;
    }

    #inapp-banner.show {
      display: block;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    #inapp-banner .banner-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    #inapp-banner .banner-sub {
      font-size: 0.78rem;
      color: #ccc;
      line-height: 1.5;
    }

    #inapp-banner .banner-sub strong {
      color: var(--rose-light);
    }

    .banner-arrow {
      display: inline-block;
      font-size: 1.4rem;
      color: var(--rose);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }
    }

    /* ── HERO ────────────────────────────────────── */
    .hero {
      margin-top: 48px;
      text-align: center;
      padding: 0 24px;
    }

    .avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .avatar-logo {
      width: 130px;
      height: 130px;
      border-radius: 20px;
      object-fit: cover;
      display: block;
      box-shadow: 0 4px 28px rgba(201, 116, 138, 0.22);
    }

    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .location {
      font-size: 0.82rem;
      color: var(--rose);
      letter-spacing: 0.06em;
    }

    /* ── DIVIDER ─────────────────────────────────── */
    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 28px auto;
    }

    /* ── LINKS ───────────────────────────────────── */
    .links {
      width: 100%;
      max-width: 420px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border-radius: 14px;
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .25s;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      border-color: var(--rose);
    }

    .link-btn:hover::before {
      opacity: 1;
    }

    .link-btn:active {
      transform: scale(0.98);
    }

    .link-btn .icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.3rem;
    }

    .link-btn .label {
      flex: 1;
    }

    .link-btn .label span {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 300;
      margin-top: 2px;
      letter-spacing: 0.06em;
    }

    .link-btn .arrow {
      color: var(--muted);
      font-size: 0.9rem;
      transition: color .2s, transform .2s;
    }

    .link-btn:hover .arrow {
      color: var(--rose-light);
      transform: translateX(3px);
    }

    /* per-platform colors */
    .btn-instagram .icon {
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    }

    .btn-facebook .icon {
      background: #1877f2;
    }

    .btn-viber .icon {
      background: #665cac;
    }

    .btn-telegram .icon {
      background: #26a5e4;
    }

    /* ── FOOTER ──────────────────────────────────── */
    .footer {
      margin-top: 44px;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
    }

    /* subtle background grain */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      z-index: 0;
    }

    .hero,
    .links,
    .footer {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
